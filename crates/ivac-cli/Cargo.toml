[package]
name = "ivac-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "ivaCAM headless CLI converter"

[[bin]]
name = "ivac"
path = "src/main.rs"

[lints]
workspace = true

[features]
# .cps post runtime — default ON for the desktop-class transports;
# only the size-sensitive wasm build leaves it opt-in.
default = ["cps"]
cps = ["ivac-core/cps", "dep:ivac-cps"]

[dependencies]
ivac-core = { workspace = true }
ivac-cps = { workspace = true, optional = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
